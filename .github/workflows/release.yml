name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ビルド前に検証する。1つでも壊れていれば公開しない。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:"
            echo "$unformatted"
            exit 1
          fi

  # ビルド・リリース公開・Homebrew tap 更新を GoReleaser がまとめて行う
  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 変更履歴の生成に全履歴とタグが必要
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: リリース本文のテンプレートを読み込む
        run: |
          {
            echo "RELEASE_HEADER<<__EOF__"
            cat .github/RELEASE_TEMPLATE.md
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 別リポジトリ（homebrew-tap）へ push するため PAT が必要
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
